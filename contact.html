<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Contact Us - PlayingHours</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#0f172a;color:#fff;padding:120px 5% 100px;}
.header{position:fixed;top:0;left:0;width:100%;background:rgba(15,23,42,.95);backdrop-filter:blur(20px);z-index:100;padding:1rem 5%;border-bottom:1px solid rgba(255,255,255,.1)}
.nav{display:flex;justify-content:space-between;align-items:center;max-width:1400px;margin:0 auto}
.logo{text-decoration:none;font-weight:900;font-size:1.5rem;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.content-box{max-width:800px;margin:0 auto;background:rgba(255,255,255,0.05);padding:3rem;border-radius:24px;border:1px solid rgba(255,255,255,0.1)}
h1{margin-bottom:1.5rem;font-size:2.5rem;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p{margin-bottom:1rem;color:rgba(255,255,255,0.7);line-height:1.6}
.form-group{margin-bottom:1.5rem}
label{display:block;margin-bottom:0.5rem;font-weight:600}
input,textarea,select{width:100%;padding:1rem;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:12px;color:#fff;outline:none}
.submit-btn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:1rem 2rem;border:none;border-radius:12px;font-weight:700;cursor:pointer;width:100%}
</style>
</head>
<body>
<header class="header"><nav class="nav"><a href="index.html" class="logo">PlayingHours</a></nav></header>
<div class="content-box">
    <h1>Contact & Support</h1>
    <p>Have a question or found a bug? We are here to help!</p>
    <form>
        <div class="form-group"><label>Type of Inquiry</label>
            <select><option>General Question</option><option>Report a Bug 🐛</option><option>Business Inquiry</option></select>
        </div>
        <div class="form-group"><label>Email Address</label><input type="email" placeholder="your@email.com"></div>
        <div class="form-group"><label>Message</label><textarea rows="5" placeholder="Describe your issue or feedback..."></textarea></div>
        <button type="button" class="submit-btn" onclick="alert('Message Sent! We will get back to you soon.')">Send Message</button>
    </form>
</div>
</body>
</html>
