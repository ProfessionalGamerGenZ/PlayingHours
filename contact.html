<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Contact & Support - PlayingHours</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Poppins',sans-serif;background:#0f172a;color:#fff;padding:120px 5% 100px;}
    .header{position:fixed;top:0;left:0;width:100%;background:rgba(15,23,42,.95);backdrop-filter:blur(20px);z-index:100;padding:1rem 5%;border-bottom:1px solid rgba(255,255,255,.1)}
    .nav{display:flex;justify-content:space-between;align-items:center;max-width:1400px;margin:0 auto}
    .logo{text-decoration:none;font-weight:900;font-size:1.5rem;color:#667eea}
    .content-box{max-width:800px;margin:0 auto;background:rgba(255,255,255,0.05);padding:3rem;border-radius:24px;border:1px solid rgba(255,255,255,0.1)}
    h1{margin-bottom:1rem;font-size:2.5rem;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .form-group{margin-bottom:1.5rem}
    label{display:block;margin-bottom:0.5rem;font-weight:600;color:rgba(255,255,255,0.8)}
    input,textarea,select{width:100%;padding:1rem;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:#fff;outline:none;transition:0.3s}
    input:focus{border-color:#667eea}
    .submit-btn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:1rem 2rem;border:none;border-radius:12px;font-weight:700;cursor:pointer;width:100%;font-size:1.1rem}
    
    /* Success Banner Style */
    #success-banner {
        display: none;
        position: fixed;
        top: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: #10b981; /* Green color */
        color: white;
        padding: 12px 30px;
        border-radius: 50px;
        font-weight: 600;
        z-index: 1000;
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        align-items: center;
        gap: 10px;
    }
</style>
</head>
<body>
    <header class="header"><nav class="nav"><a href="index.html" class="logo">PlayingHours</a></nav></header>

    <div id="success-banner">✅ Message Sent Successfully!</div>

    <div class="content-box">
        <h1>Contact Support</h1>
        <p style="margin-bottom:20px; color:gray;">Please fill the form below. For bug reports, include your device name.</p>
        <form id="contactForm">
            <div class="form-group">
                <label>Inquiry Type</label>
                <select id="type"><option>General Inquiry</option><option>Report a Bug 🐛</option><option>Account Issue</option><option>Partnership</option></select>
            </div>
            <div class="form-group"><label>Your Name</label><input type="text" id="name" required placeholder="John Doe"></div>
            <div class="form-group"><label>Email Address</label><input type="email" id="email" required placeholder="john@example.com"></div>
            <div class="form-group"><label>Detailed Message</label><textarea id="msg" rows="5" required placeholder="How can we help you?"></textarea></div>
            <button type="submit" class="submit-btn">SEND MESSAGE</button>
        </form>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const banner = document.getElementById('success-banner');
            banner.style.display = 'flex';
            this.reset();
            setTimeout(() => { banner.style.display = 'none'; }, 4000);
        });
    </script>
</body>
</html>
