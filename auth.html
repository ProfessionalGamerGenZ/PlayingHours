<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login - PlayingHours</title>

<script>(function(s){s.dataset.zone='10546196',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

<script>(function(s){s.dataset.zone='10546226',s.src='https://gizokraijaw.net/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.auth-box{background:rgba(255,255,255,.95);border-radius:24px;padding:2.5rem;width:100%;max-width:450px;box-shadow:0 25px 70px rgba(0,0,0,.4);position:relative;z-index:10}
.logo{text-align:center;margin-bottom:2rem}
.logo-icon{width:70px;height:70px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin:0 auto .75rem;color:#fff}
.logo-text{font-size:2rem;font-weight:900;color:#1e293b}
.tabs{display:flex;gap:.5rem;margin-bottom:2rem;background:#f1f5f9;padding:.25rem;border-radius:12px}
.tab{flex:1;padding:.875rem;background:transparent;border:none;color:#64748b;font-weight:700;border-radius:10px;cursor:pointer;transition:.3s}
.tab.active{background:#fff;color:#1e293b;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.form-content{display:none}
.form-content.active{display:block}
.form-group{margin-bottom:1.25rem}
.form-group label{display:block;color:#1e293b;font-weight:700;margin-bottom:.5rem}
.form-group input,.form-group select{width:100%;padding:1rem;background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;color:#1e293b;font-size:1rem;font-weight:600;transition:.3s}
.form-group input::placeholder{color:#94a3b8}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#667eea;background:#fff}
.form-group select option{background:#fff;color:#1e293b}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.btn{width:100%;padding:1rem;border:none;border-radius:12px;font-weight:800;font-size:1rem;cursor:pointer;transition:.3s}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.btn-primary:hover{transform:translateY(-2px)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.divider{display:flex;align-items:center;gap:1rem;margin:1.5rem 0;color:#64748b;font-size:.9375rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e2e8f0}
.btn-guest{background:#f1f5f9;color:#1e293b;border:2px solid #e2e8f0}
.form-footer{text-align:center;margin-top:1.5rem;color:#64748b}
.form-footer a{color:#667eea;font-weight:800;cursor:pointer;text-decoration:none}
.back-link{text-align:center;margin-top:1.5rem}
.back-link a{color:#64748b;font-weight:700;text-decoration:none}
.message{padding:.875rem;border-radius:10px;margin-bottom:1.25rem;display:none;font-weight:600}
.error{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5}
.success{background:#d1fae5;color:#059669;border:1px solid #6ee7b7}
.guest-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);align-items:center;justify-content:center;z-index:1000}
.guest-modal.active{display:flex}
.guest-modal-box{background:#fff;padding:2.5rem;border-radius:24px;max-width:420px;width:90%}
.guest-modal h3{font-size:1.75rem;margin-bottom:1.25rem;text-align:center;font-weight:900;color:#1e293b}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="auth-box">
<div class="logo">
<div class="logo-icon">🎮</div>
<div class="logo-text">PlayingHours</div>
</div>

<div id="message" class="message"></div>

<div class="tabs">
<button class="tab active" data-tab="login">Login</button>
<button class="tab" data-tab="register">Register</button>
</div>

<div class="form-content active" id="login-form">
<form id="login">
<div class="form-group">
<label>Username</label>
<input type="text" name="username" placeholder="Enter username" required>
</div>
<div class="form-group">
<label>Password</label>
<input type="password" name="password" placeholder="Enter password" required>
</div>
<button type="submit" class="btn btn-primary">Login</button>
</form>
<div class="divider">OR</div>
<button class="btn btn-guest" id="guest-btn">Continue as Guest</button>
<div class="form-footer">
Don't have an account? <a data-switch="register">Sign up</a>
</div>
</div>

<div class="form-content" id="register-form">
<form id="register">
<div class="form-group">
<label>Username</label>
<input type="text" name="username" placeholder="Choose username" required minlength="3" maxlength="20">
</div>
<div class="form-group">
<label>Email (Optional)</label>
<input type="email" name="email" placeholder="your@email.com">
</div>
<div class="form-group">
<label>Password</label>
<input type="password" name="password" placeholder="Create password" required minlength="6">
</div>
<div class="form-row">
<div class="form-group">
<label>Gender</label>
<select name="gender" required>
<option value="">Select</option>
<option value="male">Male</option>
<option value="female">Female</option>
<option value="other">Other</option>
</select>
</div>
<div class="form-group">
<label>Age</label>
<input type="number" name="age" placeholder="Age" required min="13" max="100">
</div>
</div>
<button type="submit" class="btn btn-primary">Create Account</button>
</form>
<div class="form-footer">
Already have an account? <a data-switch="login">Login</a>
</div>
</div>

<div class="back-link">
<a href="index.html">← Back to Home</a>
</div>
</div>

<div class="guest-modal" id="guest-modal">
<div class="guest-modal-box">
<h3>Choose Username</h3>
<div class="form-group">
<label>Guest Username</label>
<input type="text" id="guest-username" placeholder="Enter username" maxlength="15">
</div>
<button class="btn btn-primary" id="guest-continue">Continue</button>
<button class="btn btn-guest" id="guest-cancel" style="margin-top:.75rem">Cancel</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const YOUR_SUPABASE_URL = 'https://chcepamgczwfguzroddn.supabase.co';
const YOUR_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoY2VwYW1nY3p3Zmd1enJvZGRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2OTkxOTYsImV4cCI6MjA4NTI3NTE5Nn0.f5IefTnesklFtFvkjjgK11BBwEEpbvb1anBTEQbNJ18'

const db = window.supabase.createClient(YOUR_SUPABASE_URL, YOUR_SUPABASE_KEY);

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.form-content').forEach(f=>f.classList.remove('active'));
    this.classList.add('active');
    document.getElementById(this.dataset.tab+'-form').classList.add('active');
    document.getElementById('message').style.display='none';
  });
});

document.querySelectorAll('[data-switch]').forEach(link=>{
  link.addEventListener('click',function(){
    document.querySelector(`[data-tab="${this.dataset.switch}"]`).click();
  });
});

document.getElementById('login').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const btn=e.target.querySelector('button');
  btn.disabled=true;
  btn.textContent='Logging in...';
  const data=new FormData(e.target);
  try{
    const{data:user,error}=await db.from('users').select('*').eq('username',data.get('username')).eq('password',data.get('password')).maybeSingle();
    if(error)throw new Error(error.message);
    if(!user)throw new Error('Invalid credentials');
    localStorage.setItem('userId',user.id);
    localStorage.setItem('username',user.username);
    localStorage.setItem('coins',user.coins);
    localStorage.setItem('isLoggedIn','true');
    location.href='lobby.html';
  }catch(err){
    showError(err.message);
    btn.disabled=false;
    btn.textContent='Login';
  }
});

document.getElementById('register').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const btn=e.target.querySelector('button');
  btn.disabled=true;
  btn.textContent='Creating...';
  const data=new FormData(e.target);
  try{
    const{data:existing}=await db.from('users').select('username').eq('username',data.get('username')).maybeSingle();
    if(existing)throw new Error('Username taken');
    const{data:user,error}=await db.from('users').insert({
      username:data.get('username'),
      password:data.get('password'),
      email:data.get('email')||null,
      gender:data.get('gender'),
      age:parseInt(data.get('age')),
      coins:500
    }).select();
    if(error)throw new Error(error.message);
    showSuccess('Success! Redirecting...');
    setTimeout(()=>{
      localStorage.setItem('userId',user[0].id);
      localStorage.setItem('username',user[0].username);
      localStorage.setItem('coins','500');
      localStorage.setItem('isLoggedIn','true');
      location.href='lobby.html';
    },1500);
  }catch(err){
    showError(err.message);
    btn.disabled=false;
    btn.textContent='Create Account';
  }
});

document.getElementById('guest-btn').addEventListener('click',()=>{
  document.getElementById('guest-modal').classList.add('active');
  document.getElementById('guest-username').value='Guest'+Math.floor(Math.random()*9999);
});

document.getElementById('guest-cancel').addEventListener('click',()=>{
  document.getElementById('guest-modal').classList.remove('active');
});

document.getElementById('guest-continue').addEventListener('click',()=>{
  const username=document.getElementById('guest-username').value.trim();
  if(username.length<3)return alert('Username too short');
  localStorage.setItem('username',username);
  localStorage.setItem('coins','100');
  localStorage.setItem('isLoggedIn','true');
  location.href='lobby.html';
});

function showError(msg){
  const el=document.getElementById('message');
  el.className='message error';
  el.textContent=msg;
  el.style.display='block';
}

function showSuccess(msg){
  const el=document.getElementById('message');
  el.className='message success';
  el.textContent=msg;
  el.style.display='block';
}
</script>
</body>
</html>
