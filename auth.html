<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login - PlayingHours</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.auth-container{background:rgba(255,255,255,.1);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:2.5rem;width:100%;max-width:450px;box-shadow:0 25px 70px rgba(0,0,0,.4)}
.logo{text-align:center;margin-bottom:2rem}
.logo-icon{width:70px;height:70px;background:rgba(255,255,255,.2);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin:0 auto .75rem;border:2px solid rgba(255,255,255,.3)}
.logo-text{font-size:2rem;font-weight:900;color:#fff}
.tabs{display:flex;gap:.5rem;margin-bottom:2rem;background:rgba(0,0,0,.2);padding:.25rem;border-radius:12px}
.tab{flex:1;padding:.875rem;background:transparent;border:none;color:rgba(255,255,255,.6);font-weight:700;border-radius:10px;cursor:pointer;transition:.3s}
.tab.active{background:rgba(255,255,255,.25);color:#fff}
.form-content{display:none}
.form-content.active{display:block}
.form-group{margin-bottom:1.25rem}
.form-group label{display:block;color:#fff;font-weight:700;margin-bottom:.5rem}
.form-group input,.form-group select{width:100%;padding:1rem;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.25);border-radius:12px;color:#fff;font-size:1rem;font-weight:600}
.form-group input::placeholder{color:rgba(255,255,255,.5)}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#fff;background:rgba(255,255,255,.2)}
.form-group select option{background:#1e293b;color:#fff}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.btn{width:100%;padding:1rem;border:none;border-radius:12px;font-weight:800;font-size:1rem;cursor:pointer;transition:.3s}
.btn-primary{background:#fff;color:#667eea}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(0,0,0,.4)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.divider{display:flex;align-items:center;gap:1rem;margin:1.5rem 0;color:rgba(255,255,255,.7);font-size:.9375rem;font-weight:600}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.25)}
.btn-guest{background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.3)}
.form-footer{text-align:center;margin-top:1.5rem;color:rgba(255,255,255,.9)}
.form-footer a{color:#fff;font-weight:800;cursor:pointer;text-decoration:none}
.back-link{text-align:center;margin-top:1.5rem}
.back-link a{color:rgba(255,255,255,.9);font-weight:700;text-decoration:none}
.error,.success{padding:.875rem;border-radius:10px;margin-bottom:1.25rem;display:none;font-weight:600}
.error{background:rgba(239,68,68,.25);color:#fca5a5;border:1px solid rgba(239,68,68,.4)}
.success{background:rgba(16,185,129,.25);color:#6ee7b7;border:1px solid rgba(16,185,129,.4)}
.guest-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);align-items:center;justify-content:center;z-index:1000}
.guest-modal.active{display:flex}
.guest-modal-content{background:linear-gradient(135deg,#1e293b,#334155);padding:2.5rem;border-radius:24px;max-width:420px;width:90%;border:2px solid rgba(255,255,255,.15)}
.guest-modal h3{font-size:1.75rem;margin-bottom:1.25rem;text-align:center;font-weight:900}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="auth-container">
<div class="logo">
<div class="logo-icon">🎮</div>
<div class="logo-text">PlayingHours</div>
</div>

<div id="error" class="error"></div>
<div id="success" class="success"></div>

<div class="tabs">
<button class="tab active" onclick="switchTab('login')">Login</button>
<button class="tab" onclick="switchTab('register')">Register</button>
</div>

<div class="form-content active" id="loginForm">
<form onsubmit="handleLogin(event)">
<div class="form-group">
<label>Username</label>
<input type="text" id="loginUsername" placeholder="Enter username" required minlength="3">
</div>
<div class="form-group">
<label>Password</label>
<input type="password" id="loginPassword" placeholder="Enter password" required minlength="6">
</div>
<button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
</form>
<div class="divider">OR</div>
<button class="btn btn-guest" onclick="showGuestModal()">Continue as Guest</button>
<div class="form-footer">
Don't have an account? <a onclick="switchTab('register')">Sign up</a>
</div>
</div>

<div class="form-content" id="registerForm">
<form onsubmit="handleRegister(event)">
<div class="form-group">
<label>Username</label>
<input type="text" id="regUsername" placeholder="Choose username" required minlength="3" maxlength="20">
</div>
<div class="form-group">
<label>Email (Optional)</label>
<input type="email" id="regEmail" placeholder="your@email.com">
</div>
<div class="form-group">
<label>Password</label>
<input type="password" id="regPassword" placeholder="Create password" required minlength="6">
</div>
<div class="form-row">
<div class="form-group">
<label>Gender</label>
<select id="regGender" required>
<option value="">Select</option>
<option value="male">Male</option>
<option value="female">Female</option>
<option value="other">Other</option>
</select>
</div>
<div class="form-group">
<label>Age</label>
<input type="number" id="regAge" placeholder="Age" required min="13" max="100">
</div>
</div>
<button type="submit" class="btn btn-primary" id="registerBtn">Create Account</button>
</form>
<div class="form-footer">
Already have an account? <a onclick="switchTab('login')">Login</a>
</div>
</div>

<div class="back-link">
<a href="index.html">← Back to Home</a>
</div>
</div>

<div class="guest-modal" id="guestModal">
<div class="guest-modal-content">
<h3>Choose Username</h3>
<div class="form-group">
<label>Guest Username</label>
<input type="text" id="guestUsername" placeholder="Enter username" maxlength="15">
</div>
<button class="btn btn-primary" onclick="continueAsGuest()">Continue</button>
<button class="btn btn-guest" onclick="closeGuestModal()" style="margin-top:.75rem">Cancel</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Supabase config
const SUPABASE_URL='https://chcepamgczwfguzroddn.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoY2VwYW1nY3p3Zmd1enJvZGRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzg1NTQxODgsImV4cCI6MjA1NDEzMDE4OH0.ojtRcp7dUNGMlon33jkKuw_gYzkSLPM';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

console.log('Supabase initialized:',SUPABASE_URL);

function switchTab(tab){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.querySelectorAll('.form-content').forEach(f=>f.classList.remove('active'));
hideMessages();
if(tab==='login'){
document.querySelectorAll('.tab')[0].classList.add('active');
document.getElementById('loginForm').classList.add('active');
}else{
document.querySelectorAll('.tab')[1].classList.add('active');
document.getElementById('registerForm').classList.add('active');
}
}

async function handleLogin(e){
e.preventDefault();
const btn=document.getElementById('loginBtn');
btn.disabled=true;
btn.textContent='Logging in...';
const username=document.getElementById('loginUsername').value.trim();
const password=document.getElementById('loginPassword').value;
try{
console.log('Login attempt:',username);
const{data,error}=await supabase.from('users').select('*').eq('username',username).eq('password',password).maybeSingle();
console.log('Login response:',{data,error});
if(error){
showError('Error: '+error.message);
btn.disabled=false;
btn.textContent='Login';
return;
}
if(!data){
showError('Invalid username or password');
btn.disabled=false;
btn.textContent='Login';
return;
}
if(data.is_banned){
showError('Account banned');
btn.disabled=false;
btn.textContent='Login';
return;
}
localStorage.setItem('userId',data.id);
localStorage.setItem('username',data.username);
localStorage.setItem('coins',data.coins);
localStorage.setItem('isLoggedIn','true');
console.log('Login successful!');
window.location.href='lobby.html';
}catch(err){
console.error('Login error:',err);
showError('Login failed: '+err.message);
btn.disabled=false;
btn.textContent='Login';
}
}

async function handleRegister(e){
e.preventDefault();
const btn=document.getElementById('registerBtn');
btn.disabled=true;
btn.textContent='Creating...';
const username=document.getElementById('regUsername').value.trim();
const email=document.getElementById('regEmail').value.trim();
const password=document.getElementById('regPassword').value;
const gender=document.getElementById('regGender').value;
const age=parseInt(document.getElementById('regAge').value);
try{
console.log('Registration attempt:',username);
const{data:existing}=await supabase.from('users').select('username').eq('username',username).maybeSingle();
if(existing){
showError('Username already taken');
btn.disabled=false;
btn.textContent='Create Account';
return;
}
const userData={
username,
password,
email:email||null,
gender,
age,
coins:500,
gems:0,
referral_code:Math.random().toString(36).substr(2,8).toUpperCase()
};
console.log('Inserting user:',userData);
const{data,error}=await supabase.from('users').insert(userData).select();
console.log('Registration response:',{data,error});
if(error){
console.error('Registration error:',error);
showError('Registration failed: '+error.message);
btn.disabled=false;
btn.textContent='Create Account';
return;
}
showSuccess('Account created! Logging in...');
setTimeout(()=>{
localStorage.setItem('userId',data[0].id);
localStorage.setItem('username',username);
localStorage.setItem('coins','500');
localStorage.setItem('isLoggedIn','true');
console.log('Registration successful!');
window.location.href='lobby.html';
},1500);
}catch(err){
console.error('Registration exception:',err);
showError('Registration failed: '+err.message);
btn.disabled=false;
btn.textContent='Create Account';
}
}

function showGuestModal(){
document.getElementById('guestModal').classList.add('active');
document.getElementById('guestUsername').value='Guest'+Math.floor(Math.random()*9999);
}

function closeGuestModal(){
document.getElementById('guestModal').classList.remove('active');
}

function continueAsGuest(){
const username=document.getElementById('guestUsername').value.trim();
if(username.length<3){
alert('Username must be at least 3 characters');
return;
}
localStorage.setItem('username',username);
localStorage.setItem('coins','100');
localStorage.setItem('isGuest','true');
localStorage.setItem('isLoggedIn','true');
console.log('Guest login successful!');
window.location.href='lobby.html';
}

function showError(msg){
const el=document.getElementById('error');
el.textContent=msg;
el.style.display='block';
setTimeout(()=>el.style.display='none',6000);
}

function showSuccess(msg){
const el=document.getElementById('success');
el.textContent=msg;
el.style.display='block';
}

function hideMessages(){
document.getElementById('error').style.display='none';
document.getElementById('success').style.display='none';
}
</script>
</body>
</html>
