<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Profile - PlayingHours</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#1e293b;--dim:#64748b;--primary:#667eea;--secondary:#764ba2}
[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f1f5f9;--dim:#94a3b8}
[data-theme="ocean"]{--bg:#0c4a6e;--card:#075985;--border:#0369a1;--text:#e0f2fe;--dim:#bae6fd;--primary:#06b6d4;--secondary:#0891b2}
[data-theme="sunset"]{--bg:#7c2d12;--card:#9a3412;--border:#c2410c;--text:#fed7aa;--dim:#fdba74;--primary:#fb923c;--secondary:#f97316}
[data-theme="forest"]{--bg:#14532d;--card:#166534;--border:#15803d;--text:#d1fae5;--dim:#86efac;--primary:#22c55e;--secondary:#16a34a}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;transition:.3s}

/* GLASS MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem;backdrop-filter:blur(8px);animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.box{background:rgba(255,255,255,.95);backdrop-filter:blur(30px);border:2px solid rgba(255,255,255,.5);border-radius:20px;max-width:480px;width:100%;position:relative;animation:zoomIn .4s;box-shadow:0 25px 80px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.1) inset;overflow:hidden}
@keyframes zoomIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}

[data-theme="dark"] .box{background:rgba(30,41,59,.95);border:2px solid rgba(255,255,255,.1)}

/* CLOSE BTN */
.close{position:absolute;top:1rem;right:1rem;width:40px;height:40px;background:rgba(248,250,252,.9);backdrop-filter:blur(10px);border:2px solid rgba(226,232,240,.5);border-radius:50%;cursor:pointer;font-size:1.5rem;color:var(--dim);z-index:10;display:flex;align-items:center;justify-content:center;transition:.3s;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.close:hover{background:var(--primary);color:#fff;border-color:var(--primary);transform:rotate(90deg) scale(1.1)}

/* HEADER */
.header{background:linear-gradient(135deg,var(--primary),var(--secondary));padding:2rem 1.5rem 1.5rem;text-align:center;color:#fff;position:relative}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:30px;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.05))}

.avatar{width:80px;height:80px;background:#fff;border-radius:50%;margin:0 auto .75rem;display:flex;align-items:center;justify-content:center;font-size:2.5rem;box-shadow:0 8px 20px rgba(0,0,0,.2),0 0 0 4px rgba(255,255,255,.3)}

.username{font-size:1.5rem;font-weight:900;margin-bottom:.25rem;text-shadow:0 2px 8px rgba(0,0,0,.2)}

.user-id{font-size:.75rem;opacity:.9;margin-bottom:.75rem;font-weight:600}

.level{display:inline-block;background:rgba(255,255,255,.25);backdrop-filter:blur(10px);padding:.375rem 1rem;border-radius:50px;font-weight:800;font-size:.875rem;box-shadow:0 4px 12px rgba(0,0,0,.15);border:1px solid rgba(255,255,255,.3)}

/* CONTENT */
.content{padding:1.5rem;max-height:450px;overflow-y:auto}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-track{background:rgba(0,0,0,.05);border-radius:10px}
.content::-webkit-scrollbar-thumb{background:var(--primary);border-radius:10px}

/* STATS GRID */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1.25rem}

.stat{background:rgba(255,255,255,.8);backdrop-filter:blur(10px);border:2px solid rgba(226,232,240,.8);border-radius:12px;padding:.875rem;text-align:center;transition:.3s;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.stat:hover{transform:translateY(-4px);border-color:var(--primary);box-shadow:0 8px 20px rgba(0,0,0,.1)}

[data-theme="dark"] .stat{background:rgba(51,65,85,.8);border-color:rgba(255,255,255,.1)}

.stat-icon{font-size:1.5rem;margin-bottom:.375rem}

.stat-value{font-size:1.375rem;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.125rem}

.stat-label{font-size:.75rem;color:var(--dim);font-weight:600}

/* SECTIONS */
.section{background:rgba(255,255,255,.8);backdrop-filter:blur(10px);border:2px solid rgba(226,232,240,.8);border-radius:14px;margin-bottom:1rem;overflow:hidden;transition:.3s;box-shadow:0 4px 12px rgba(0,0,0,.05)}

[data-theme="dark"] .section{background:rgba(51,65,85,.8);border-color:rgba(255,255,255,.1)}

.section-head{padding:1rem 1.25rem;cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.02);transition:.3s}
.section-head:hover{background:rgba(102,126,234,.1)}

.section-title{font-size:.9375rem;font-weight:800;display:flex;align-items:center;gap:.625rem}

.toggle{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:1.125rem;transition:.3s;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.toggle:hover{background:rgba(0,0,0,.05);color:var(--text)}

.section-body{transition:max-height .3s ease,padding .3s ease,opacity .3s ease;overflow:hidden}
.section-body.collapsed{max-height:0!important;padding:0!important;opacity:0}
.section-body.expanded{padding:1rem 1.25rem}

/* XP BAR */
.xp-bar{background:rgba(0,0,0,.1);border-radius:50px;height:10px;overflow:hidden;margin-bottom:.625rem;position:relative}
.xp-bar::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:shimmer 2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

.xp-fill{background:linear-gradient(90deg,var(--primary),var(--secondary));height:100%;border-radius:50px;transition:.5s;box-shadow:0 0 10px rgba(102,126,234,.5)}

.xp-text{display:flex;justify-content:space-between;font-size:.8125rem;color:var(--dim);font-weight:600}

/* WALLET */
.wallet{display:grid;grid-template-columns:repeat(2,1fr);gap:.875rem}

.wallet-item{background:rgba(248,250,252,.9);backdrop-filter:blur(10px);border-radius:10px;padding:1rem;display:flex;align-items:center;gap:.875rem;transition:.3s}
.wallet-item:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}

[data-theme="dark"] .wallet-item{background:rgba(15,23,42,.9)}

.wallet-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.375rem;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 4px 12px rgba(102,126,234,.3)}

.wallet-info{flex:1}
.wallet-label{font-size:.75rem;color:var(--dim);margin-bottom:.25rem;font-weight:600}
.wallet-value{font-size:1.25rem;font-weight:900}

/* MATCHES */
.matches{display:flex;flex-direction:column;gap:.625rem;max-height:240px;overflow-y:auto}
.matches::-webkit-scrollbar{width:5px}
.matches::-webkit-scrollbar-track{background:rgba(0,0,0,.05);border-radius:10px}
.matches::-webkit-scrollbar-thumb{background:var(--primary);border-radius:10px}

.match{background:rgba(248,250,252,.9);backdrop-filter:blur(10px);border-radius:10px;padding:.875rem;display:flex;justify-content:space-between;align-items:center;transition:.3s}
.match:hover{background:rgba(226,232,240,.9);transform:translateX(4px)}

[data-theme="dark"] .match{background:rgba(15,23,42,.9)}
[data-theme="dark"] .match:hover{background:rgba(30,41,59,.9)}

.match-left{display:flex;align-items:center;gap:.75rem}

.match-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.125rem;color:#fff;box-shadow:0 4px 12px rgba(102,126,234,.3)}

.match-info h4{font-size:.875rem;font-weight:800;margin-bottom:.125rem}
.match-info p{font-size:.75rem;color:var(--dim)}

.match-right{text-align:right}

.result{display:inline-block;padding:.3rem .625rem;border-radius:6px;font-weight:800;font-size:.75rem;backdrop-filter:blur(10px)}
.result.win{background:rgba(16,185,129,.2);color:#10b981;border:1px solid rgba(16,185,129,.4)}
.result.loss{background:rgba(239,68,68,.2);color:#ef4444;border:1px solid rgba(239,68,68,.4)}
.result.draw{background:rgba(245,158,11,.2);color:#f59e0b;border:1px solid rgba(245,158,11,.4)}

.match-time{font-size:.6875rem;color:var(--dim);margin-top:.25rem;font-weight:600}

/* EMPTY */
.empty{text-align:center;padding:2.5rem 1rem;color:var(--dim)}
.empty-icon{font-size:3rem;margin-bottom:.875rem;opacity:.4}
.empty-text{font-size:.9375rem;font-weight:600}

@media(max-width:768px){
.stats{grid-template-columns:repeat(2,1fr)}
.wallet{grid-template-columns:1fr}
.box{max-width:100%}
}
</style>
</head>
<body data-theme="light">

<div class="modal">
<div class="box">
<button class="close" onclick="closeProfile()">×</button>

<div class="header">
<div class="avatar">👤</div>
<h1 class="username" id="username">Loading...</h1>
<p class="user-id">ID: <span id="userId">—</span></p>
<div class="level">⭐ Level <span id="userLevel">1</span></div>
</div>

<div class="content">
<div class="stats">
<div class="stat">
<div class="stat-icon">🎮</div>
<div class="stat-value" id="totalGames">0</div>
<div class="stat-label">Games</div>
</div>
<div class="stat">
<div class="stat-icon">🏆</div>
<div class="stat-value" id="totalWins">0</div>
<div class="stat-label">Wins</div>
</div>
<div class="stat">
<div class="stat-icon">📊</div>
<div class="stat-value" id="winRate">0%</div>
<div class="stat-label">Rate</div>
</div>
<div class="stat">
<div class="stat-icon">🔥</div>
<div class="stat-value" id="winStreak">0</div>
<div class="stat-label">Streak</div>
</div>
</div>

<div class="section">
<div class="section-head" onclick="toggle('xp')">
<div class="section-title">📈 Experience</div>
<button class="toggle" id="xp-btn">▼</button>
</div>
<div class="section-body expanded" id="xp-body">
<div class="xp-bar">
<div class="xp-fill" id="xpFill" style="width:0%"></div>
</div>
<div class="xp-text">
<span>Level <span id="currentLevel">1</span></span>
<span><span id="currentXP">0</span>/<span id="nextXP">100</span> XP</span>
</div>
</div>
</div>

<div class="section">
<div class="section-head" onclick="toggle('wallet')">
<div class="section-title">💰 Wallet</div>
<button class="toggle" id="wallet-btn">▼</button>
</div>
<div class="section-body expanded" id="wallet-body">
<div class="wallet">
<div class="wallet-item">
<div class="wallet-icon">💰</div>
<div class="wallet-info">
<div class="wallet-label">Coins</div>
<div class="wallet-value" id="userCoins">0</div>
</div>
</div>
<div class="wallet-item">
<div class="wallet-icon">💎</div>
<div class="wallet-info">
<div class="wallet-label">Gems</div>
<div class="wallet-value" id="userGems">0</div>
</div>
</div>
</div>
</div>
</div>

<div class="section">
<div class="section-head" onclick="toggle('history')">
<div class="section-title">📜 Match History</div>
<button class="toggle" id="history-btn">▼</button>
</div>
<div class="section-body expanded" id="history-body">
<div class="matches" id="matchList">
<div class="empty">
<div class="empty-icon">🎮</div>
<div class="empty-text">No matches yet</div>
</div>
</div>
</div>
</div>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient('https://chcepamgczwfguzroddn.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoY2VwYW1nY3p3Zmd1enJvZGRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2OTkxOTYsImV4cCI6MjA4NTI3NTE5Nn0.f5IefTnesklFtFvkjjgK11BBwEEpbvb1anBTEQbNJ18');

const user={
id:localStorage.getItem('userId'),
username:localStorage.getItem('username')||'Player',
coins:parseInt(localStorage.getItem('coins'))||0
};

async function loadProfile(){
document.getElementById('username').textContent=user.username;
document.getElementById('userId').textContent=user.id?.substr(0,8)||'guest';
document.getElementById('userCoins').textContent=user.coins;
document.getElementById('userGems').textContent='0';

try{
const{data:matches}=await db.from('matches').select('*').or(`winner_id.eq.${user.id},players.cs.{${user.id}}`).order('created_at',{ascending:false}).limit(10);

if(matches&&matches.length>0){
const total=matches.length;
const wins=matches.filter(m=>m.winner_id===user.id).length;
const rate=Math.round((wins/total)*100);

document.getElementById('totalGames').textContent=total;
document.getElementById('totalWins').textContent=wins;
document.getElementById('winRate').textContent=rate+'%';

let streak=0;
for(let m of matches){
if(m.winner_id===user.id)streak++;
else break;
}
document.getElementById('winStreak').textContent=streak;

const xp=total*10+wins*25;
const level=Math.floor(xp/100)+1;
const currXP=xp%100;
document.getElementById('userLevel').textContent=level;
document.getElementById('currentLevel').textContent=level;
document.getElementById('currentXP').textContent=currXP;
document.getElementById('nextXP').textContent='100';
document.getElementById('xpFill').style.width=currXP+'%';

renderMatches(matches);
}
}catch(e){
console.error(e);
}
}

function renderMatches(matches){
if(!matches||!matches.length)return;
const html=matches.map(m=>{
const isWin=m.winner_id===user.id;
const isDraw=!m.winner_id;
const result=isDraw?'draw':isWin?'win':'loss';
return`
<div class="match">
<div class="match-left">
<div class="match-icon">${getIcon(m.game_type)}</div>
<div class="match-info">
<h4>${getName(m.game_type)}</h4>
<p>vs ${getOpp(m)}</p>
</div>
</div>
<div class="match-right">
<div class="result ${result}">${result.toUpperCase()}</div>
<div class="match-time">${getTime(m.created_at)}</div>
</div>
</div>
`;
}).join('');
document.getElementById('matchList').innerHTML=html;
}

function toggle(id){
const body=document.getElementById(id+'-body');
const btn=document.getElementById(id+'-btn');
body.classList.toggle('collapsed');
body.classList.toggle('expanded');
btn.textContent=body.classList.contains('expanded')?'▼':'▶';
}

function getIcon(type){
const icons={tictactoe:'❌',ludo:'🎲',chess:'♟️',snake:'🐍'};
return icons[type]||'🎮';
}

function getName(type){
const names={tictactoe:'Tic Tac Toe',ludo:'Ludo',chess:'Chess',snake:'Snake'};
return names[type]||type;
}

function getOpp(m){
try{
const p=Array.isArray(m.players)?m.players:JSON.parse(m.players||'[]');
return p.find(x=>x!==user.username)||'Opponent';
}catch{return'Opponent'}
}

function getTime(date){
const s=Math.floor((new Date()-new Date(date))/1000);
if(s<60)return'Just now';
if(s<3600)return Math.floor(s/60)+'m ago';
if(s<86400)return Math.floor(s/3600)+'h ago';
return Math.floor(s/86400)+'d ago';
}

function closeProfile(){
window.history.back();
}

document.body.setAttribute('data-theme',localStorage.getItem('theme')||'light');
loadProfile();
</script>
</body>
</html>
